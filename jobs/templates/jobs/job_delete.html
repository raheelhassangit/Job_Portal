{% extends "base.html" %}
{% block title %}Delete Job{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white border border-[#e3ddef] rounded-2xl p-8 text-center">
    <h1 class="text-[#4d4b52] text-lg font-bold mb-3">Delete this job?</h1>
    <p class="text-gray-500 text-sm mb-1">Are you sure you want to remove:</p>
    <p class="text-[#7852c4] font-semibold mb-6">"{{ job.title }}"</p>
    <p class="text-gray-400 text-xs mb-6">This will hide the listing but keep existing applications on record.</p>

    <form method="POST" class="flex gap-3">
      {% csrf_token %}
      <button type="submit" class="flex-1 bg-red-50 text-red-600 border border-red-200 font-semibold py-2.5 rounded-lg text-sm hover:bg-red-100 transition">
        Yes, Delete
      </button>
      <a href="{% url 'jobs:job_detail' job_id=job.pk %}" class="flex-1 bg-[#f0eaf9] text-[#7852c4] font-semibold py-2.5 rounded-lg text-sm hover:bg-[#e6dcf5] transition">
        Cancel
      </a>
    </form>
  </div>
</div>
{% endblock %}
